<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d09">
<title>차 한 잔의 시간 · Time for Tea</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#120d09; --bg-1:#1d150e; --glow:#37301a;
    --gold:#cdbf63; --gold-soft:#e4d691; --gold-line:#6b5f30;
    --ink:#efe6d6; --ink-dim:#9c8f78; --ink-faint:#7d715c; --line:#3a3322; --track:#4a4128;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 75% at 50% 30%, var(--glow) 0%, var(--bg-1) 46%, var(--bg-0) 82%);
    color:var(--ink); font-family:"Gowun Batang",serif;
    min-height:100%; overflow:hidden; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .app{
    position:relative; width:min(100vw,460px); margin:0 auto; min-height:100%;
    display:flex; flex-direction:column; gap:.45rem;
    padding:calc(.85rem + env(safe-area-inset-top)) 1.05rem calc(.85rem + env(safe-area-inset-bottom));
  }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); clip-path:inset(50%); white-space:nowrap; border:0;
  }

  /* header */
  .top-actions{
    position:absolute; top:calc(.65rem + env(safe-area-inset-top)); left:.8rem; right:.8rem; z-index:30;
    display:flex; align-items:center; justify-content:space-between; pointer-events:none;
  }
  .top-actions button, .top-actions a{
    pointer-events:auto; min-height:44px; border:0; background:none; color:var(--ink-dim); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .top-actions .reset-top{
    min-width:78px; padding:0 .2rem; font-family:inherit; font-size:1.15rem;
  }
  .top-actions .help-link{
    min-width:44px; padding:0 .2rem; font-family:inherit; font-size:1.15rem;
  }
  .top-actions button:active, .top-actions a:active{ color:var(--gold-soft); }
  .hdr{ text-align:center; flex:0 0 auto; }
  .hdr .title{ font-size:1.18rem; font-weight:700; color:var(--gold-soft); letter-spacing:.06em; }
  .hdr .sub{ font-family:"Space Mono",monospace; font-size:.62rem; letter-spacing:.18em; color:var(--ink-dim); margin-top:.18rem; }

  /* tea first */
  .tea-picker{
    position:relative; z-index:12; flex:0 0 auto; margin-top:1.05rem;
    display:flex; flex-direction:column; align-items:center; width:100%;
  }

  /* hero */
  .hero{ position:relative; flex:1 1 auto; min-height:195px; display:flex; align-items:center; justify-content:center; margin-top:.1rem; margin-bottom:.1rem; }
  .hero svg.stage{ width:100%; height:100%; max-height:42vh; display:block; }
  .halo{ position:absolute; left:50%; top:48%; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; opacity:0; transition:opacity .4s; }
  .halo.h1{ width:54%; aspect-ratio:1; border:2px solid rgba(205,191,99,.5); }
  .halo.h2{ width:40%; aspect-ratio:1; border:1.5px solid rgba(228,214,145,.45); }
  .urgent .halo{ animation:halo 1s ease-in-out infinite; }
  .urgent .halo.h2{ animation-delay:.25s; }
  @keyframes halo{ 0%,100%{opacity:.2;transform:translate(-50%,-50%) scale(1)} 50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08)} }

  .readout{ position:absolute; left:0; right:0; top:var(--readout-top,18%); transform:translateY(-50%); text-align:center; pointer-events:none; }
  .readout .time{ font-family:"Space Mono",monospace; font-weight:700; font-size:2.2rem; letter-spacing:.02em; color:var(--ink); text-shadow:0 1px 8px rgba(0,0,0,.78); transition:color .3s; }
  .readout.done .time, .urgent .readout .time{ color:var(--gold-soft); }
  .urgent .readout .time{ animation:num 1s ease-in-out infinite; }
  @keyframes num{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  .message{ position:absolute; top:1.5%; left:50%; transform:translateX(-50%); font-size:.9rem; letter-spacing:.08em; color:var(--ink-dim); white-space:nowrap; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,.7); transition:color .3s; z-index:6; }
  .message:empty{ display:none; }
  .message.gold{ color:var(--gold-soft); text-shadow:0 0 12px rgba(228,214,145,.45); }
  .tea-preview{
    position:relative; left:auto; top:auto; transform:none; z-index:5; width:min(70%,270px); aspect-ratio:5/1;
    margin-top:.2rem; margin-bottom:.15rem; pointer-events:none; opacity:.9;
    transition:opacity .24s ease, transform .24s ease; filter:drop-shadow(0 8px 12px rgba(0,0,0,.42));
  }
  .tea-preview.hide{ opacity:0; transform:translateY(-6px); }
  .tea-preview .chahe{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:.94; }
  .tea-preview .dry-leaves{
    position:absolute; left:24%; top:14%; width:52%; height:68%; overflow:visible;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.42));
  }
  .tea-picker.locked .tea-preview{ opacity:.35; transform:none; }
  .tea-picker.locked .dots, .tea-picker.locked .chev, .tea-picker.locked .ghost{ opacity:0; pointer-events:none; }
  .tea-picker.locked .cur{ color:var(--ink-dim); text-shadow:none; }
  .vessel-nav{
    position:absolute; top:55%; transform:translateY(-50%); z-index:7;
    width:44px; height:44px; border:0; background:none; color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .vessel-nav.prev{ left:-.25rem; }
  .vessel-nav.next{ right:-.25rem; }
  .vessel-nav svg{ width:22px; height:22px; }
  /* controls */
  .controls{ flex:0 0 auto; display:flex; flex-direction:column; gap:.42rem; }
  .carousel{ position:relative; display:flex; align-items:center; gap:.25rem; padding:0 3rem; width:100%; }
  .carousel .chev{ position:absolute; top:50%; z-index:8; transform:translateY(-50%); background:none; border:none; color:var(--ink-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; padding:0; transition:opacity .2s; }
  .carousel .chev:first-child{ left:0; }
  .carousel .chev:last-child{ right:0; }
  .carousel .chev svg{ width:20px; height:20px; }
  .carousel .track{
    flex:1; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    align-items:center; column-gap:.72rem; overflow:hidden; height:36px;
  }
  .carousel .ghost{ font-size:.72rem; color:var(--ink-faint); opacity:.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .carousel .ghost:first-child{ text-align:right; }
  .carousel .ghost:last-child{ text-align:left; }
  .carousel .cur{
    display:inline-flex; align-items:center; justify-content:center; gap:.42rem;
    flex:none; white-space:nowrap; padding:0 .35rem; color:var(--gold-soft);
    font-size:1.04rem; font-weight:700; letter-spacing:.02em; text-shadow:0 0 10px rgba(228,214,145,.22);
  }
  .carousel .cur .tea-dot{
    width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 8px rgba(228,214,145,.22);
  }
  .dots{ position:relative; left:auto; right:auto; top:auto; display:flex; gap:.25rem; justify-content:center; align-items:center; margin-top:.1rem; transition:opacity .2s; }
  .dots i{ width:5px; height:5px; border-radius:50%; background:var(--track); transition:width .2s,background .2s; }
  .dots i.on{ width:13px; border-radius:3px; background:var(--gold); }

  .slider-row{ padding:.08rem 0 .12rem; margin-top:0; }
  .slider-row .top{ display:flex; align-items:center; justify-content:center; gap:.45rem; font-size:.96rem; color:var(--ink-dim); margin-bottom:.08rem; }
  .slider-row .temp-hint{
    font-family:"Space Mono",monospace; font-size:.768rem; letter-spacing:.05em; color:var(--gold-soft);
    opacity:.86; transform:translateY(.02rem);
  }
  .infusion-line{
    min-height:1rem; margin-bottom:.18rem; color:var(--ink-faint); font-size:.92rem; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.04em;
  }
  .slider-row .val{
    display:block; text-align:center; font-family:"Gowun Batang",serif; font-weight:700;
    font-size:2.25rem; line-height:1; color:var(--gold-soft); margin:0 0 .28rem;
    text-shadow:0 1px 10px rgba(0,0,0,.45);
  }
  .slider-row .val .val-suffix{
    font-size:1.05rem; font-weight:400; color:var(--ink-dim); margin-left:.45rem; letter-spacing:.06em;
  }
  .slider-line{ display:flex; align-items:center; gap:.75rem; }
  .range-wrap{ position:relative; flex:1; display:flex; align-items:center; }
  .recommended-mark{
    position:absolute; left:calc(15px + (100% - 30px)*var(--recommended-f,.13)); top:50%; z-index:2;
    width:2px; height:14px; border-radius:2px; background:rgba(239,230,214,.5);
    box-shadow:0 0 0 1px rgba(18,13,9,.45);
    transform:translate(-50%,-50%); pointer-events:none;
  }
  .step{ width:44px; height:44px; flex:none; border-radius:50%; border:0.5px solid var(--line); background:rgba(255,255,255,.02); color:var(--ink-dim); font-size:1.35rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .step:active{ background:rgba(255,255,255,.06); }
  .step:disabled{ opacity:.45; cursor:default; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:999px; outline:none;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold) var(--p,20%),var(--track) var(--p,20%),var(--track) 100%);
  }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:30px; height:30px; border-radius:50%; background:var(--gold-soft); border:2px solid #2a2414; box-shadow:0 0 10px rgba(205,191,99,.55); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:30px; height:30px; border-radius:50%; background:var(--gold-soft); border:2px solid #2a2414; cursor:pointer; }
  input[type=range]:disabled{ opacity:.45; }

  .brew{ width:100%; font-family:"Gowun Batang",serif; font-weight:700; letter-spacing:.1em; font-size:.98rem; color:var(--bg-0); background:linear-gradient(180deg,var(--gold-soft),var(--gold)); border:none; border-radius:999px; padding:.75rem 0; cursor:pointer; transition:filter .15s,transform .1s,opacity .2s; }
  .brew:active{ transform:translateY(1px); }
  .brew[disabled]{ opacity:.5; filter:grayscale(.25); cursor:default; background:none; border:0.5px solid var(--line); color:var(--ink-dim); }

  .footer{ display:flex; align-items:center; justify-content:space-between; font-size:.88rem; color:var(--ink-dim); margin-top:1.05rem; padding-bottom:.45rem; }
  .footer button{ background:none; border:none; color:var(--ink-dim); cursor:pointer; font-family:"Gowun Batang",serif; font-size:.88rem; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:.35rem; min-height:44px; padding:0 .2rem; }
  .footer button:active{ color:var(--gold-soft); }
  .footer button svg{ width:16px; height:16px; }
  .footer button.muted .wave{ opacity:0; }
  .footer button .slash{ opacity:0; }
  .footer button.muted .slash{ opacity:1; }

  .modal-backdrop{
    position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
    padding:1rem; background:rgba(6,4,2,.58); backdrop-filter:blur(5px);
  }
  .modal-backdrop[hidden]{ display:none; }
  .support-modal{
    position:relative; width:min(100%,330px); border:1px solid rgba(205,191,99,.28); border-radius:8px;
    background:linear-gradient(180deg,rgba(37,28,18,.98),rgba(20,14,9,.98)); color:var(--ink);
    padding:1.35rem 1.2rem 1.15rem; box-shadow:0 20px 48px rgba(0,0,0,.52);
    text-align:center;
  }
  .support-modal h2{ font-size:1.12rem; color:var(--gold-soft); margin-bottom:.72rem; }
  .support-modal p{ font-size:.94rem; line-height:1.62; color:var(--ink); word-break:keep-all; }
  .modal-close{
    position:absolute; top:.35rem; right:.38rem; width:44px; height:44px; border:0; background:none;
    color:var(--ink-dim); cursor:pointer; font-size:1.3rem; line-height:1;
  }
  .modal-actions{ display:flex; align-items:center; justify-content:center; gap:.55rem; margin-top:1.1rem; }
  .modal-actions[hidden], .modal-actions button[hidden]{ display:none; }
  .modal-actions button{
    min-height:42px; border-radius:8px; border:1px solid var(--gold-line); padding:0 .95rem;
    font-family:inherit; font-size:.92rem; cursor:pointer;
  }
  .modal-primary{ background:var(--gold-soft); color:var(--bg-0); }
  .modal-ghost{ background:transparent; color:var(--ink-dim); }

  .flash{ position:fixed; inset:0; background:#fffae4; opacity:0; pointer-events:none; z-index:50; }
  .flash.go{ animation:flash 1.4s ease-out 1; }
  @keyframes flash{ 0%{opacity:0} 12%{opacity:.5} 100%{opacity:0} }

  @media (prefers-reduced-motion: reduce){
    .urgent .halo,.urgent .readout .time{ animation:none; }
    .flash.go{ animation:none; }
  }
  @media (max-height: 720px){
    .app{ gap:.34rem; padding:calc(.7rem + env(safe-area-inset-top)) .95rem calc(.7rem + env(safe-area-inset-bottom)); }
    .hdr .title{ font-size:1.05rem; }
    .hdr .sub{ margin-top:.12rem; }
    .hero{ min-height:160px; }
    .hero svg.stage{ max-height:35vh; }
    .tea-picker{ margin-top:.32rem; }
    .tea-preview{ top:2.55rem; width:min(66%,248px); opacity:.86; }
    .controls{ gap:.42rem; }
    .carousel{ padding:0 2.7rem; }
    .carousel .chev{ top:2.55rem; }
    .carousel .track{ height:34px; }
    .dots{ top:5.45rem; }
    .slider-row{ margin-top:0; }
    .slider-row .top{ font-size:.936rem; gap:.38rem; }
    .slider-row .temp-hint{ font-size:.696rem; }
    .infusion-line{ font-size:.864rem; margin-bottom:.2rem; }
    .slider-row .val{ font-size:2.28rem; margin-bottom:.3rem; }
    .step{ width:44px; height:44px; }
    input[type=range]::-webkit-slider-thumb{ width:26px; height:26px; }
    input[type=range]::-moz-range-thumb{ width:26px; height:26px; }
    .brew{ padding:.78rem 0; }
  }

  /* Bottom Sheet Modal for Tea Feeling Notes */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 100; background: rgba(6, 4, 2, 0.72); backdrop-filter: blur(8px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
  }
  .sheet-backdrop.active { opacity: 1; pointer-events: auto; }
  .sheet-container {
    width: min(100vw, 440px); max-height: 88vh; background: #1a140d; border: 1px solid var(--line);
    border-radius: 20px 20px 0 0; padding: 1.25rem 1.15rem 1.4rem; overflow-y: auto;
    transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6); color: var(--ink);
  }
  .sheet-backdrop.active .sheet-container { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 1rem; }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem; }
  .sheet-title { font-size: 1.12rem; font-weight: 700; color: var(--gold-soft); letter-spacing: 0.04em; }
  .btn-close-sheet { background: none; border: none; color: var(--ink-dim); font-size: 1.4rem; cursor: pointer; padding: 0.2rem 0.5rem; }

  /* Summary Card */
  .summary-card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px;
    padding: 0.85rem 1rem; margin-bottom: 1.2rem;
  }
  .summary-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
  .tea-info-group { display: flex; align-items: center; gap: 0.4rem; }
  .tea-title { font-size: 1.05rem; font-weight: 700; color: var(--ink); }
  .btn-edit-title { background: none; border: none; color: var(--ink-dim); cursor: pointer; padding: 2px 4px; font-size: 0.85rem; }
  .btn-edit-title:hover { color: var(--gold-soft); }
  .session-date { font-family: "Space Mono", monospace; font-size: 0.78rem; color: var(--ink-dim); }
  .infusion-history { font-size: 0.88rem; color: var(--gold-soft); letter-spacing: 0.02em; }
  .edit-input-inline {
    background: #120d09; border: 1px solid var(--gold-line); color: var(--gold-soft);
    font-family: inherit; font-size: 0.95rem; padding: 0.2rem 0.4rem; border-radius: 4px; width: 180px;
  }

  /* Section Styles */
  .section-label { font-size: 0.92rem; font-weight: 700; color: var(--ink-dim); margin-bottom: 0.6rem; display: block; }
  
  /* Tag Chips Grid (Option 3: Borderless Soft Fill Badge) */
  .tags-grid { display: flex; flex-wrap: wrap; gap: 0.35rem 0.4rem; margin-bottom: 1.25rem; }
  .tag-chip {
    min-height: 30px; padding: 0.22rem 0.55rem; border-radius: 4px; border: none;
    background: rgba(255,255,255,0.05); color: var(--ink-dim); font-family: inherit; font-size: 0.84rem;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s;
    user-select: none;
  }
  .tag-chip.active {
    color: var(--gold-soft); background: rgba(205, 191, 99, 0.22);
    box-shadow: 0 0 10px rgba(205, 191, 99, 0.25); font-weight: 700;
  }

  /* Note Textarea */
  .note-textarea {
    width: 100%; min-height: 80px; background: rgba(0,0,0,0.25); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.75rem; color: var(--ink); font-family: inherit; font-size: 0.88rem;
    line-height: 1.5; resize: none; outline: none; margin-bottom: 1.15rem; transition: border-color 0.2s;
  }
  .note-textarea:focus { border-color: var(--gold-line); }

  /* Action Buttons */
  .action-grid { display: grid; grid-template-columns: 1fr 1.1fr 1.3fr; gap: 0.45rem; }
  .btn-action {
    min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    color: var(--ink); font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.25rem; transition: all 0.15s;
  }
  .btn-action:active { background: rgba(205, 191, 99, 0.15); border-color: var(--gold-soft); color: var(--gold-soft); }

  /* Toast Notification */
  .toast {
    position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(37, 28, 18, 0.95); border: 1px solid var(--gold); color: var(--gold-soft);
    padding: 0.6rem 1.2rem; border-radius: 999px; font-size: 0.88rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Generated Card Preview Overlay */
  .card-modal-backdrop {
    position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .card-modal-backdrop.active { opacity: 1; pointer-events: auto; }
  .card-preview-box {
    width: min(100%, 340px); background: #18120b; border: 1px solid var(--gold-line); border-radius: 16px;
    padding: 1.4rem; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8); position: relative;
  }
  .card-header-badge { font-family: "Space Mono", monospace; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--gold); margin-bottom: 1rem; }
  .card-tea-name { font-size: 1.25rem; font-weight: 700; color: var(--ink); margin-bottom: 0.3rem; }
  .card-infusions { font-size: 0.85rem; color: var(--gold-soft); margin-bottom: 1rem; }
  .card-tags { display: flex; flex-direction: column; gap: 0.35rem; align-items: center; margin-bottom: 1rem; }
  .card-tags-row { display: flex; gap: 0.35rem; justify-content: center; width: 100%; }
  .card-tag { font-size: 0.78rem; background: rgba(205,191,99,0.14); color: var(--gold-soft); border: none; padding: 0.2rem 0.55rem; border-radius: 4px; font-weight: 700; }
  .card-note-quote { font-size: 0.9rem; font-style: italic; color: var(--ink); line-height: 1.5; border-left: 2px solid var(--gold); padding-left: 0.8rem; margin: 1rem 0; text-align: left; }
  .card-footer-date { font-size: 0.72rem; color: var(--ink-faint); margin-top: 1.2rem; }
  .btn-close-card { margin-top: 1.2rem; width: 100%; padding: 0.7rem 0; border-radius: 8px; border: none; background: var(--gold-soft); color: var(--bg-0); font-family: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="top-actions">
    <button class="reset-top" id="reset">우림 끝</button>
    <a class="help-link" href="help.html" aria-label="사용법 열기" title="사용법">사용법</a>
  </div>

  <div class="hdr">

    const rec=recommendedSecFor(infusion);
    const p=((sec-5)/115)*100, recF=(rec-5)/115;
    els.slider.style.setProperty("--p",p+"%");
    els.rangeWrap.style.setProperty("--recommended-f",recF);
    els.slider.setAttribute("aria-valuetext",`${sec}초, 권장 ${rec}초`);
    els.tempHint.textContent=`${tea().temp}°C / ${rec}초`;
    els.secVal.textContent=brewLabel(infusion,sec);
    updateInfusionLine();
  }
  els.slider.addEventListener("input",()=>{ sec=clamp(Math.round(+els.slider.value/5)*5,5,120); rememberTimeAdjustment(); syncSlider(); if(phase==="idle"||phase==="done") previewIdle(); });
  els.dec.onclick=()=>{ if(phase!=="idle"&&phase!=="done") return; sec=clamp(sec-1,5,120); rememberTimeAdjustment(); syncSlider(); previewIdle(); };
  els.inc.onclick=()=>{ if(phase!=="idle"&&phase!=="done") return; sec=clamp(sec+1,5,120); rememberTimeAdjustment(); syncSlider(); previewIdle(); };

  // ---- rendering ----
  function applyLiquor(rectEl, surfEl, alpha, strength, top, full){
    const col=mix(tea().light, tea().strong, strength);
    if(rectEl){
      els.liquorTop.setAttribute("stop-color", rgb(mix(col, tea().light, .45)));   // 수면 쪽 옅음
      els.liquorBot.setAttribute("stop-color", rgb(mix(col, tea().strong, .4)));   // 바닥 쪽 진함
      rectEl.setAttribute("fill","url(#liquorGrad)"); rectEl.setAttribute("opacity",alpha.toFixed(3));
      rectEl.setAttribute("y",top); rectEl.setAttribute("height",Math.max(0,full-top));
    }
    if(surfEl){ surfEl.setAttribute("fill",rgb(mix(col,[255,248,210],.18))); surfEl.setAttribute("opacity",(alpha*1.05).toFixed(3)); surfEl.setAttribute("cy",top); }
  }
  function gaiwanWallAt(y){
    if(y<=152){
      const t=clamp((y-126)/26,0,1);
      return {left:lerp(58,60,t), right:lerp(142,140,t)};
    }
    const t=clamp((y-152)/14,0,1);
    return {left:lerp(60,74,t), right:lerp(140,126,t)};
  }
  function gaiwanLiquidPath(top, lvl){
    const wall=gaiwanWallAt(top), bottom=165.6;
    const contactY=lerp(top,154,0.82), contact=gaiwanWallAt(contactY);
    const low=gaiwanWallAt(162.5);
    const surfaceLift=(reduce?0:Math.sin(performance.now()/720))*0.55*Math.min(1,lvl);
    const bottomRx=lerp(8,24,lvl);
    const topDip=lerp(1.1,2.6,lvl)+surfaceLift;
    return [
      `M ${wall.left.toFixed(2)} ${top.toFixed(2)}`,
      `C ${(wall.left+14).toFixed(2)} ${(top-topDip).toFixed(2)} ${(wall.right-14).toFixed(2)} ${(top-topDip).toFixed(2)} ${wall.right.toFixed(2)} ${top.toFixed(2)}`,
      `C ${(wall.right+.6).toFixed(2)} ${(top+8).toFixed(2)} ${(contact.right+.8).toFixed(2)} ${(contactY-7).toFixed(2)} ${contact.right.toFixed(2)} ${contactY.toFixed(2)}`,
      `C ${(low.right-1.4).toFixed(2)} 159.8 ${(100+bottomRx*1.05).toFixed(2)} ${(bottom-2).toFixed(2)} ${(100+bottomRx*.58).toFixed(2)} ${bottom.toFixed(2)}`,
      `C ${(100+bottomRx*.24).toFixed(2)} ${(bottom+1.4).toFixed(2)} ${(100-bottomRx*.24).toFixed(2)} ${(bottom+1.4).toFixed(2)} ${(100-bottomRx*.58).toFixed(2)} ${bottom.toFixed(2)}`,
      `C ${(100-bottomRx*1.05).toFixed(2)} ${(bottom-2).toFixed(2)} ${(low.left+1.4).toFixed(2)} 159.8 ${contact.left.toFixed(2)} ${contactY.toFixed(2)}`,
      `C ${(contact.left-.8).toFixed(2)} ${(contactY-7).toFixed(2)} ${(wall.left-.6).toFixed(2)} ${(top+8).toFixed(2)} ${wall.left.toFixed(2)} ${top.toFixed(2)}`,
      "Z"
    ].join(" ");
  }
  function gaiwanMeniscusPath(top, lvl){
    const wall=gaiwanWallAt(top);
    const lift=(reduce?0:Math.sin(performance.now()/720))*0.55*Math.min(1,lvl);
    const dip=lerp(1.1,2.6,lvl)+lift;
    return `M ${wall.left.toFixed(2)} ${top.toFixed(2)} C ${(wall.left+14).toFixed(2)} ${(top-dip).toFixed(2)} ${(wall.right-14).toFixed(2)} ${(top-dip).toFixed(2)} ${wall.right.toFixed(2)} ${top.toFixed(2)}`;
  }
  function gaiwanWallWashPath(top, side){
    const y0=top+1.2, y1=lerp(top,154,.82), y2=164.5;
    const w0=gaiwanWallAt(y0), w1=gaiwanWallAt(y1), w2=gaiwanWallAt(y2);
    const outer0=side<0?w0.left:w0.right, outer1=side<0?w1.left:w1.right, outer2=side<0?w2.left:w2.right;
    const inset0=side<0?5.8:-5.8, inset1=side<0?4.8:-4.8, inset2=side<0?2.9:-2.9;
    return [
      `M ${outer0.toFixed(2)} ${y0.toFixed(2)}`,
      `C ${(outer0+side*-0.8).toFixed(2)} ${(top+11).toFixed(2)} ${(outer1+side*-0.7).toFixed(2)} ${(y1-5).toFixed(2)} ${outer1.toFixed(2)} ${y1.toFixed(2)}`,
      `C ${(outer1+side*-0.4).toFixed(2)} ${(y1+6).toFixed(2)} ${(outer2+side*-0.4).toFixed(2)} 159.8 ${outer2.toFixed(2)} ${y2.toFixed(2)}`,
      `L ${(outer2+inset2).toFixed(2)} ${(y2-.8).toFixed(2)}`,
      `C ${(outer1+inset1).toFixed(2)} ${(y1+5).toFixed(2)} ${(outer0+inset0).toFixed(2)} ${(top+10).toFixed(2)} ${(outer0+inset0).toFixed(2)} ${(y0+.6).toFixed(2)}`,
      "Z"
    ].join(" ");
  }
  function applyGaiwanLiquor(alpha, strength, top, lvl){
    const col=mix(tea().light, tea().strong, strength);
    els.liquorTop.setAttribute("stop-color", rgb(mix(col, tea().light, .48)));
    els.liquorBot.setAttribute("stop-color", rgb(mix(col, tea().strong, .35)));
    els.gLiquid.setAttribute("fill","url(#liquorGrad)");
    els.gLiquid.setAttribute("opacity",alpha.toFixed(3));
    els.gLiquid.setAttribute("d",gaiwanLiquidPath(top,lvl));
    els.gMeniscus.setAttribute("d",gaiwanMeniscusPath(top,lvl));
    els.gMeniscus.setAttribute("stroke",rgb(mix(col,[255,248,210],.35)));
    els.gMeniscus.setAttribute("opacity",(alpha*.42).toFixed(3));
    els.gWallLeft.setAttribute("d",gaiwanWallWashPath(top,-1));
    els.gWallRight.setAttribute("d",gaiwanWallWashPath(top,1));
    [els.gWallLeft,els.gWallRight].forEach(el=>{
      el.setAttribute("fill",rgb(mix(col,tea().strong,.38)));
      el.setAttribute("opacity",(alpha*.62*Math.min(1,lvl*1.6)).toFixed(3));
    });
  }
  function setRing(remaining, total, urgent){
    const frac=clamp(remaining/total,0,1);
    els.ringProg.setAttribute("stroke-dashoffset", (ringC*(1-frac)).toFixed(1));
    els.ringTrack.setAttribute("opacity",".25");
    els.ringProg.setAttribute("opacity", urgent?".9":".4");
    els.ringProg.setAttribute("stroke", urgent?"#e4d691":"#8c7f63");
    els.ringProg.setAttribute("stroke-width", urgent?"3":"2");
  }
  function clearRing(){ els.ringProg.setAttribute("opacity","0"); els.ringTrack.setAttribute("opacity","0"); }

  // 김 분출구: 주전자=뚜껑+꼭지, 개완·표일배=뚜껑 테두리 틈새 양쪽, 머그=수면. dx=가로 드리프트
  function steamPorts(){
    switch(vesselId){
      case "teapot":      return [{x:100,y:90,dx:0},{x:32,y:104,dx:-0.42}];   // 뚜껑 · 꼭지
      case "eastern-pot": return [{x:100,y:95,dx:0},{x:42,y:107,dx:-0.38}];   // 뚜껑 · 꼭지
      case "gaiwan":      return [{x:68,y:95,dx:-0.12},{x:132,y:95,dx:0.12}]; // 뚜껑-사발 림 틈새
      case "mug":         return [{...fitPoint("mug",96,82),dx:0}];
      case "piaoyibei":   return [{...fitPoint("piaoyibei",73,52),dx:-0.12},{...fitPoint("piaoyibei",121,52),dx:0.12}]; // 뚜껑-컵 림 틈새
      default:            return [{x:100,y:100,dx:0}];
    }
  }
  function setSteam(intensity){
    const g=els.steam, ports=steamPorts();
    const perPort=Math.round(intensity*3), want=ports.length*perPort;   // 포트당 최대 3가닥
    while(g.children.length<want){ const e=document.createElementNS(SVGNS,"ellipse"); e._t=Math.random(); e._s=0.7+Math.random()*0.6; g.appendChild(e); }
    while(g.children.length>want) g.removeChild(g.lastChild);
    [...g.children].forEach((e,i)=>{
      const port=ports[i%ports.length], k=Math.floor(i/ports.length);
      e._t=(e._t+0.005)%1; const t=e._t, sway=Math.sin(t*6.28+i)*5;
      e.setAttribute("cx", (port.x + port.dx*t*22 + sway + (k-perPort/2)*5).toFixed(1));
      e.setAttribute("cy", (port.y-6 - t*46).toFixed(1));
      e.setAttribute("rx", (4+t*9*e._s).toFixed(1)); e.setAttribute("ry", (6+t*13*e._s).toFixed(1));
      e.setAttribute("fill","#fff7e0"); e.setAttribute("opacity",(Math.sin(Math.PI*t)*0.21).toFixed(3));
    });
  }
  // 수면 일렁임: 시간 기반으로 ellipse 크기를 미세 진동(임박 구간 amp↑)
  function shimmerSurf(el, baseRx, baseRy, lvl){
    if(!el) return;
    const tt=performance.now()/1000, amp=reduce?0:(0.4+0.7*(isUrgent?1:0))*Math.min(1,lvl);
    el.setAttribute("rx",(baseRx + Math.sin(tt*1.7)*amp*1.4).toFixed(2));
    el.setAttribute("ry",(baseRy + Math.sin(tt*2.3+1)*amp).toFixed(2));
  }
  function pyLowerPath(top, amount){
    const cx=97, bottom=190, t=clamp(amount,0,1);
    const topRx=lerp(5,23,t), botRx=lerp(7,16,t);
    const topLift=lerp(0,2.3,t), bottomBulge=lerp(0,1.2,t);
    return [
      `M ${(cx-topRx).toFixed(2)} ${top.toFixed(2)}`,
      `C ${(cx-topRx*.55).toFixed(2)} ${(top-topLift).toFixed(2)} ${(cx+topRx*.55).toFixed(2)} ${(top-topLift).toFixed(2)} ${(cx+topRx).toFixed(2)} ${top.toFixed(2)}`,
      `L ${(cx+botRx).toFixed(2)} ${(bottom-4).toFixed(2)}`,
      `C ${(cx+botRx*.85).toFixed(2)} ${(bottom+bottomBulge).toFixed(2)} ${(cx+botRx*.36).toFixed(2)} ${(bottom+bottomBulge).toFixed(2)} ${cx} ${bottom.toFixed(2)}`,
      `C ${(cx-botRx*.36).toFixed(2)} ${(bottom+bottomBulge).toFixed(2)} ${(cx-botRx*.85).toFixed(2)} ${(bottom+bottomBulge).toFixed(2)} ${(cx-botRx).toFixed(2)} ${(bottom-4).toFixed(2)}`,
      "Z"
    ].join(" ");
  }
  // 물줄기가 떨어지는 착지 높이(도구별 입구)
  function pourLandY(){ return vesselId==="gaiwan"?122 : vesselId==="piaoyibei"?fitY("piaoyibei",108) : vesselId==="mug"?fitY("mug",82) : vesselId==="eastern-pot"?100 : 95; }

  function render(){
    const v=vessel();
    const activeLevel = (phase === "done" && vesselId !== "piaoyibei") ? level * (1 - drain) : level;
    const activeAlpha = (phase === "done" && vesselId !== "piaoyibei") ? curAlpha * (1 - drain) : curAlpha;

    // gaiwan
    if(vesselId==="gaiwan"){
      const top=lerp(166,130,activeLevel);
      applyGaiwanLiquor(activeAlpha*Math.min(1,activeLevel*1.4)*.92, strengthT, top, activeLevel);
      drawLeaves(gLeaves, openEff, {baseAlpha:.55, peakAlpha:.24, minSpread:6, maxSpread:30, minScale:.38, maxScale:.42});
      els.gLid.setAttribute("opacity","0");
    } else if(vesselId==="piaoyibei"){
      // steep: chamber fills (level), color deepens; drain: chamber empties, lower fills
      const chTop=lerp(136,108,level), chAlpha=curAlpha*(1-drain);
      applyLiquor(els.pyChamber, els.pyChSurf, chAlpha*Math.min(1,level*1.4)*.82, strengthT, chTop, 136);
      shimmerSurf(els.pyChSurf, lerp(11,21,level), 4.8, level);
      const lowTop=lerp(190,154,drain);   // 손잡이 하단 살짝 밑까지 차오름
      const lowCol=rgb(mix(tea().light,tea().strong,strengthT));
      [...els.pyLowerGrad.children].forEach(s=>s.setAttribute("stop-color",lowCol)); // 깊이 그라데이션(바닥 페이드)
      els.pyLower.setAttribute("d",pyLowerPath(lowTop, drain));
      els.pyLower.setAttribute("opacity", drain>0?".42":"0");
      els.pyLowerSurf.setAttribute("cy",lowTop);
      els.pyLowerSurf.setAttribute("rx",lerp(0,23,drain).toFixed(2));
      els.pyLowerSurf.setAttribute("opacity", drain>.05?".34":"0");
      drawLeaves(pyLeaves, openEff, {baseAlpha:.55, peakAlpha:.24, minSpread:6, maxSpread:32, minScale:.38, maxScale:.42});
    } else if(vesselId==="mug"){
      const col=mix(tea().light,tea().strong,strengthT);
      const visible=activeAlpha*Math.min(1,activeLevel*1.4);
      els.mugSurfCenter.setAttribute("stop-color",rgb(mix(col,[255,248,218],.18)));
      els.mugSurfEdge.setAttribute("stop-color",rgb(mix(col,tea().strong,.08)));
      els.mugSurf.setAttribute("opacity",(visible*.78).toFixed(3));
    }
    // ambient glow for opaque vessels — 따뜻한 앰버 글로우
    if(v.vis==="none" || v.vis==="top"){
      let amb=glow*0.30*(phase === "done" ? (1 - drain) : 1);
      if(isUrgent && !reduce) amb*=0.8+0.4*(0.5+0.5*Math.sin(performance.now()/220));
      els.ambient.setAttribute("opacity",amb.toFixed(3));
      els.ambient.setAttribute("cy", v.round?124:120);
    } else els.ambient.setAttribute("opacity","0");

    // pour: 물줄기 하강 + 착지 잔물결 (붓는 중에만)
    if(phase==="pour"){
      const land=pourLandY();
      els.pour.setAttribute("opacity","1");
      els.pourStream.setAttribute("height", Math.max(0,(land-48)*clamp(level*2,0,1)).toFixed(1));
      const rip=clamp((level-0.4)/0.6,0,1);
      els.pourRipple.setAttribute("cy",land);
      els.pourRipple.setAttribute("rx",(rip*22).toFixed(1)); els.pourRipple.setAttribute("ry",(rip*5).toFixed(1));
      els.pourRipple.setAttribute("opacity",((1-rip)*0.5).toFixed(3));
    } else els.pour.setAttribute("opacity","0");

    const steamFactor = (phase==="steep"? (0.3+0.7*strengthT) : phase==="done"? 0.7 * (1 - drain) : 0);
    setSteam(steamFactor);
  }

  function previewIdle(){
    level=0; curAlpha=0; strengthT=0; openEff=0; glow=0; drain=0;
    lidLift=0; lidTarget=0; isUrgent=false; agitate=0;
    els.time.textContent=fmt(sec*1000); els.timeLabel.textContent="";
    els.timeLabel.setAttribute('aria-live','polite'); els.timeLabel.classList.remove("gold"); els.readout.classList.remove("done"); els.hero.classList.remove("urgent");
    setTeaPickerActive(true);
    clearRing(); render();
  }

  // ---- phases ----
  function startBrew(){
    void ensureAudio(); reqWake();
    setTeaPickerActive(false);
    activeBrew={n:infusion, sec};
    updateInfusionLine();
    preWarnSec=clamp(Math.round(sec*0.2),3,5); preWarned=false; lastTick=-1; drain=0;
    els.brew.disabled=true; els.slider.disabled=true; els.dec.disabled=true; els.inc.disabled=true;
    els.timeLabel.setAttribute('aria-live','polite'); els.timeLabel.classList.remove("gold"); els.readout.classList.remove("done");
    if(reduce){ level=1; enterSteep(performance.now()); return; }
    phase="pour"; pourStart=performance.now(); level=0; els.brew.textContent="물 붓는 중…";
  }
  function enterSteep(now){
    phase="steep"; steepStart=now; steepMs=sec*1000; level=1; lidTarget=0;
    els.brew.textContent="우리는 중…";
  }
  let isDrained = false;

  function finishSteep(){
    phase="done"; curAlpha=tea().peak; strengthT=1; openEff=1; glow=1; isUrgent=false; agitate=0;
    isDrained = false; drain = 0;
    setTeaPickerActive(true, {showPreview:false});
    els.time.textContent="0:00";
    els.hero.classList.remove("urgent"); els.readout.classList.add("done");
    const v=vessel();
    recordActiveBrew();
    if(v.done==="lid") lidTarget=1;
    els.timeLabel.setAttribute('aria-live','assertive');
    els.timeLabel.textContent=v.completion;
    const fl=$("flash"); if(fl){ fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); }
    void chime();
    clearRing();
    els.slider.disabled=false; els.dec.disabled=false; els.inc.disabled=false; els.brew.disabled=false;
    els.brew.textContent = (vesselId === "piaoyibei") ? "버튼 눌러 내리기" : "차 따라내기";
    relWake(); render();
  }

  function drainVessel(cb){
    const t0=performance.now(), dur=reduce?1:1400;
    (function step(now){
      drain = clamp((now-t0)/dur, 0, 1);
      render();
      if(drain < 1) requestAnimationFrame(step);
      else {
        isDrained = true;
        prepareNextInfusion();
        els.timeLabel.textContent = (vesselId === "piaoyibei") ? "出湯 · 아래 잔에 차" : "出湯 · 잔에 차 따라냄";
        els.brew.textContent = "다음 泡 우리기";
        cb && cb();
      }
    })(t0);
  }

  function reset(){
    phase="idle"; infusion=1; sec=adjustedSecFor(infusion); pyDrained=false; isDrained=false; drain=0; infusionHistory=[]; activeBrew=null;
    setInf(); syncSlider(); previewIdle();
    els.brew.disabled=false; els.slider.disabled=false; els.dec.disabled=false; els.inc.disabled=false; els.brew.textContent="우리기 시작";
    relWake();
  }
  function setInf(){ $("infLabel").textContent=infText(infusion); $("infKo").textContent=koInf(infusion); }
  function recordActiveBrew(){
    const b=activeBrew || {n:infusion, sec};
    if(!infusionHistory.some(h=>h.n===b.n)) infusionHistory.push({n:b.n, sec:b.sec});
    activeBrew=null;
    updateInfusionLine();
  }
  function prepareNextInfusion(){
    const last=infusionHistory[infusionHistory.length-1];
    infusion=(last?.n || infusion)+1;
    sec=adjustedSecFor(infusion);
    setInf(); syncSlider();
  }

  // ---- loop ----
  function frame(now){
    const dt=Math.min(now-lastNow,60); lastNow=now;
    lidLift += (lidTarget-lidLift)*(reduce?1:0.1);
    if(phase==="pour"){
      const t=clamp((now-pourStart)/900,0,1); level=ease(t); glow=Math.min(1,glow+dt*0.002);
      agitate=clamp((now-pourStart)/250,0,1);                       // 붓는 즉시 난류 최고조
      if(t>=1) enterSteep(now);
    } else if(phase==="steep"){
      const elapsed=now-steepStart, remaining=steepMs-elapsed;
      const lin=clamp(elapsed/steepMs,0,1);
      agitate=reduce?0:clamp(1-(now-steepStart)/1500,0,1);          // 우림 시작 후 1.5초간 난류가 잦아듦
      const col=reduce?1:sat(lin);   // 탕색/농도: 초반 빠른 추출
      const opn=reduce?1:ease(lin);  // 찻잎 펼침: 완만한 재수화
      curAlpha=lerp(0,tea().peak,col); strengthT=Math.min(1,col); openEff=clamp(opn*1.15,0,1); glow=Math.min(1,0.3+col);
      els.time.textContent=fmt(remaining);
      const urgent = remaining<=preWarnSec*1000+50;
      isUrgent = urgent && !reduce;
      setRing(remaining, steepMs, urgent);
      els.hero.classList.toggle("urgent", urgent && !reduce);
      els.timeLabel.textContent = urgent ? "곧 따라낼 준비" : "";
      els.timeLabel.classList.toggle("gold", urgent);
      const remSec=Math.ceil(remaining/1000);
      if(!preWarned && remaining<=preWarnSec*1000){ preWarned=true; preWarn(); lastTick=remSec; }
      else if(preWarned && remSec!==lastTick && remSec>0 && remSec<=preWarnSec){ lastTick=remSec; tick(); }
      if(remaining<=0) finishSteep();
    } else if(phase==="done"){
      glow=Math.max(0.6, glow);
    }
    if(phase!=="done"||vesselId!=="piaoyibei") render();
    requestAnimationFrame(frame);
  }

  // ---- Tea Feeling Notes & Preferences ----
  const DEFAULT_TAGS = ["단맛", "꽃향", "과일", "곡물", "구운맛", "견과", "풀", "나무", "흙", "연기", "떫음", "부드러움", "맑음", "묵직함"];
  let customTags = [...DEFAULT_TAGS];
  let customTitle = "";
  let sessionDraftNote = "";
  let sessionDraftTags = [];

  function loadPreferencesExt(){
    try{
      const raw = localStorage.getItem(PREF_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed.customTags) && parsed.customTags.length > 0){
          customTags = parsed.customTags;
        }
      }
    }catch(e){}
  }
  function savePreferencesExt(){
    try{
      const raw = localStorage.getItem(PREF_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      parsed.customTags = customTags;
      localStorage.setItem(PREF_KEY, JSON.stringify(parsed));
    }catch(e){}
  }
  loadPreferencesExt();

  function getTeaEmoji(name) {
    if (/농향|홍차|숙차|흑차|대홍포|육계|수선|암차|동방미인|탄배|배화|호지차/.test(name)) return '🍂';
    return '🍃';
  }

  function showToast(msg) {
    const toast = $("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  // Render Tags Grid
  function renderTagsGrid() {
    const grid = $("tagsGrid");
    grid.innerHTML = "";
    customTags.forEach(tag => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "tag-chip" + (sessionDraftTags.includes(tag) ? " active" : "");
      chip.textContent = "#" + tag;
      chip.onclick = () => {
        if(sessionDraftTags.includes(tag)){
          sessionDraftTags = sessionDraftTags.filter(t => t !== tag);
          chip.classList.remove("active");
        } else {
          sessionDraftTags.push(tag);
          chip.classList.add("active");
        }
      };
      grid.appendChild(chip);
    });
  }

  function updateSummaryCard() {
    const rawName = customTitle || (tea().name + " · " + vessel().name);
    const emoji = getTeaEmoji(rawName);
    $("teaTitleDisplay").textContent = emoji + " " + rawName;

    const today = new Date();
    const dateStr = today.getFullYear() + "." + String(today.getMonth()+1).padStart(2,'0') + "." + String(today.getDate()).padStart(2,'0');
    $("sessionDateDisplay").textContent = dateStr;

    if(infusionHistory.length > 0){
      const historyStr = infusionHistory.map(h => `${h.n}포 ${h.sec}초`).join(" · ");
      $("infusionHistoryDisplay").textContent = `${historyStr} (총 ${infusionHistory.length}포)`;
    } else {
      $("infusionHistoryDisplay").textContent = `우림 완료 기록 없음 (첫 우림 전)`;
    }
  }

  // Inline Title Edit
  $("editTitleBtn").onclick = () => {
    const display = $("teaTitleDisplay");
    const currentText = display.textContent.replace(/^[🍃🍂]\s*/, '');
    const input = document.createElement("input");
    input.className = "edit-input-inline";
    input.value = currentText;
    display.replaceWith(input);
    input.focus();

    function finishEdit() {
      const val = input.value.trim() || (tea().name + " · " + vessel().name);
      customTitle = val;
      const emoji = getTeaEmoji(val);
      const newSpan = document.createElement("span");
      newSpan.className = "tea-title";
      newSpan.id = "teaTitleDisplay";
      newSpan.textContent = emoji + " " + val;
      input.replaceWith(newSpan);
    }
    input.onblur = finishEdit;
    input.onkeydown = (e) => { if(e.key === "Enter") finishEdit(); };
  };

  // Open & Close Bottom Sheet
  function openNoteSheet() {
    renderTagsGrid();
    updateSummaryCard();
    $("noteInput").value = sessionDraftNote;
    $("sheetBackdrop").classList.add("active");
  }
  function closeNoteSheet() {
    sessionDraftNote = $("noteInput").value;
    $("sheetBackdrop").classList.remove("active");
  }

  $("note").onclick = openNoteSheet;
  $("closeSheetBtn").onclick = closeNoteSheet;
  $("sheetBackdrop").onclick = (e) => { if(e.target === $("sheetBackdrop")) closeNoteSheet(); };

  // Draft Save
  $("draftBtn").onclick = () => {
    sessionDraftNote = $("noteInput").value;
    showToast("임시 저장되었습니다 💾");
  };

  // Copy Plain Text
  $("copyBtn").onclick = () => {
    sessionDraftNote = $("noteInput").value;
    const rawName = customTitle || (tea().name + " · " + vessel().name);
    const emoji = getTeaEmoji(rawName);
    const today = new Date();
    const dateStr = today.getFullYear() + "." + String(today.getMonth()+1).padStart(2,'0') + "." + String(today.getDate()).padStart(2,'0');
    
    let historyLines = "우림 기록이 없습니다.";
    if(infusionHistory.length > 0){
      historyLines = infusionHistory.map(h => `${h.n}포 ${h.sec}초`).join(" / ");
    }

    const tagsLine = sessionDraftTags.length > 0 ? sessionDraftTags.map(t => `#${t}`).join(" ") : "(선택 단어 없음)";
    const noteLine = sessionDraftNote.trim() ? `"${sessionDraftNote.trim()}"` : "(노트 없음)";

    const textToCopy = `[차 한 잔의 시간 시음 노트]
${emoji} ${rawName}
📅 ${dateStr} (${infusionHistory.length}포 우림)
⏱️ ${historyLines}
🏷️ ${tagsLine}
💬 ${noteLine}`;

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(textToCopy).then(() => showToast("클립보드에 텍스트가 복사되었습니다 📋")).catch(() => showToast("복사 실패"));
    } else {
      showToast("클립보드 미지원 환경");
    }
  };

  // Balanced Tag Rows for Card Image & Preview
  function getBalancedTagRows(tags) {
    if (!tags || tags.length === 0) return [];
    const N = tags.length;
    let L = 1;
    if (N <= 4) L = 1;
    else if (N <= 8) L = 2;
    else L = 3;

    const baseCount = Math.floor(N / L);
    const remainder = N % L;
    const rows = [];
    let idx = 0;
    for (let r = 0; r < L; r++) {
      const count = baseCount + (r < remainder ? 1 : 0);
      rows.push(tags.slice(idx, idx + count));
      idx += count;
    }
    return rows;
  }

  // Card Image Generation (Canvas 680x900) & Preview
  $("cardBtn").onclick = () => {
    sessionDraftNote = $("noteInput").value;
    const rawName = customTitle || (tea().name + " · " + vessel().name);
    const emoji = getTeaEmoji(rawName);
    const today = new Date();
    const dateStr = today.getFullYear() + "." + String(today.getMonth()+1).padStart(2,'0') + "." + String(today.getDate()).padStart(2,'0');

    // Update DOM preview modal
    $("cardTeaName").textContent = emoji + " " + rawName;
    $("cardInfusions").textContent = `${infusionHistory.length > 0 ? infusionHistory.length : 1}포 우림 (${vessel().name})`;
    $("cardNoteQuote").textContent = sessionDraftNote.trim() ? `"${sessionDraftNote.trim()}"` : `"차 한 잔의 평화로운 순간"`;
    $("cardFooterDate").textContent = `${dateStr} · 차 한 잔의 시간`;

    const cardTagsContainer = $("cardTagsContainer");
    cardTagsContainer.innerHTML = "";
    const tagRows = getBalancedTagRows(sessionDraftTags);
    if(tagRows.length === 0){
      cardTagsContainer.style.display = "none";
    } else {
      cardTagsContainer.style.display = "flex";
      tagRows.forEach(row => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "card-tags-row";
        row.forEach(t => {
          const span = document.createElement("span");
          span.className = "card-tag";
          span.textContent = "#" + t;
          rowDiv.appendChild(span);
        });
        cardTagsContainer.appendChild(rowDiv);
      });
    }

    $("cardModalBackdrop").classList.add("active");
  };

  $("closeCardModalBtn").onclick = () => {
    // Generate Canvas PNG Image Download
    renderAndDownloadCanvasCard();
    $("cardModalBackdrop").classList.remove("active");
  };
  $("cardModalBackdrop").onclick = (e) => {
    if(e.target === $("cardModalBackdrop")) $("cardModalBackdrop").classList.remove("active");
  };

  function renderAndDownloadCanvasCard() {
    const canvas = document.createElement("canvas");
    canvas.width = 680;
    canvas.height = 900;
    const ctx = canvas.getContext("2d");

    // Background Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, 900);
    grad.addColorStop(0, "#1c150c");
    grad.addColorStop(1, "#100b07");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 680, 900);

    // Outer Border
    ctx.strokeStyle = "#4a3e20";
    ctx.lineWidth = 2;
    ctx.strokeRect(30, 30, 620, 840);

    // Inner Line
    ctx.strokeStyle = "rgba(205,191,99,0.3)";
    ctx.lineWidth = 1;
    ctx.strokeRect(40, 40, 600, 820);

    // Header Badge
    ctx.fillStyle = "#cdbf63";
    ctx.font = "bold 16px 'Space Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText("TIME FOR TEA · TASTING NOTE", 340, 110);

    // Tea Name
    const rawName = customTitle || (tea().name + " · " + vessel().name);
    const emoji = getTeaEmoji(rawName);
    ctx.fillStyle = "#efe6d6";
    ctx.font = "bold 38px 'Gowun Batang', serif";
    ctx.fillText(emoji + " " + rawName, 340, 185);

    // Infusion Info
    ctx.fillStyle = "#e4d691";
    ctx.font = "22px 'Gowun Batang', serif";
    ctx.fillText(`${infusionHistory.length > 0 ? infusionHistory.length : 1}포 우림 (${vessel().name})`, 340, 235);

    // History times
    if(infusionHistory.length > 0){
      ctx.fillStyle = "#9c8f78";
      ctx.font = "17px 'Space Mono', monospace";
      const hStr = infusionHistory.map(h => `${h.n}포:${h.sec}초`).join("  ");
      ctx.fillText(hStr, 340, 275);
    }

    // Divider Line
    ctx.strokeStyle = "rgba(205,191,99,0.2)";
    ctx.beginPath();
    ctx.moveTo(120, 310);
    ctx.lineTo(560, 310);
    ctx.stroke();

    // Balanced Tag Rows (Canvas)
    const tagRows = getBalancedTagRows(sessionDraftTags);
    let startY = 370;
    ctx.font = "bold 20px 'Gowun Batang', serif";

    tagRows.forEach(row => {
      let rowWidth = 0;
      const chipWidths = row.map(t => ctx.measureText("#" + t).width + 30);
      const gap = 12;
      rowWidth = chipWidths.reduce((a, b) => a + b, 0) + (row.length - 1) * gap;
      let startX = (680 - rowWidth) / 2;

      row.forEach((t, i) => {
        const w = chipWidths[i];
        const h = 38;
        // Option 3: Soft Fill Badge (No Border)
        ctx.fillStyle = "rgba(205,191,99,0.16)";
        ctx.beginPath();
        ctx.roundRect(startX, startY - 26, w, h, 6);
        ctx.fill();

        ctx.fillStyle = "#e4d691";
        ctx.textAlign = "center";
        ctx.fillText("#" + t, startX + w / 2, startY);

        startX += w + gap;
      });
      startY += 52;
    });

    // Note Quote Box
    const noteText = sessionDraftNote.trim() || "차 한 잔의 평화로운 순간";
    const quoteY = Math.max(startY + 30, 560);

    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(80, quoteY, 520, 140);
    ctx.strokeStyle = "#cdbf63";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(80, quoteY);
    ctx.lineTo(80, quoteY + 140);
    ctx.stroke();

    ctx.fillStyle = "#efe6d6";
    ctx.font = "italic 22px 'Gowun Batang', serif";
    ctx.textAlign = "left";
    
    // Multi-line note text wrapping
    const words = noteText.split("");
    let line = "";
    let lineY = quoteY + 45;
    for(let n = 0; n < words.length; n++){
      const testLine = line + words[n];
      const metrics = ctx.measureText(testLine);
      if (metrics.width > 460 && n > 0) {
        ctx.fillText(line, 110, lineY);
        line = words[n];
        lineY += 36;
        if(lineY > quoteY + 120) break;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, 110, lineY);

    // Footer Date & Brand
    const today = new Date();
    const dateStr = today.getFullYear() + "." + String(today.getMonth()+1).padStart(2,'0') + "." + String(today.getDate()).padStart(2,'0');
    ctx.fillStyle = "#7d715c";
    ctx.font = "18px 'Gowun Batang', serif";
    ctx.textAlign = "center";
    ctx.fillText(`${dateStr} · 차 한 잔의 시간`, 340, 830);

    // Download PNG
    try {
      const link = document.createElement("a");
      link.download = `tea-feeling-${dateStr}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
      showToast("카드 이미지가 저장되었습니다 🖼️");
    } catch(e) {
      showToast("이미지 저장 실패");
    }
  }

  // Brew Button Handler
  els.brew.onclick=()=>{
    if(phase==="idle"){ startBrew(); return; }
    if(phase==="done"){
      if(!isDrained){
        els.brew.disabled=true;
        els.brew.textContent = (vesselId === "piaoyibei") ? "내리는 중…" : "따라내는 중…";
        drainVessel(()=>{
          els.brew.disabled=false;
        });
        return;
      }
      startBrew();
    }
  };

  // Session Reset ("우림 끝" Button)
  $("reset").onclick = () => {
    if(infusionHistory.length > 0){
      showToast("오늘의 차 세션을 마감했습니다 🍵");
    }
    customTitle = "";
    sessionDraftNote = "";
    sessionDraftTags = [];
    reset();
  };

  $("vesselPrev").onclick=()=>selectVessel(-1);
  $("vesselNext").onclick=()=>selectVessel(1);
  $("teaPrev").onclick=()=>selectTea(teaIdx-1);
  $("teaNext").onclick=()=>selectTea(teaIdx+1);
  $("mute").onclick=function(){
    muted=!muted;
    this.classList.toggle("muted",muted);
    this.setAttribute("aria-pressed",muted);
    const label = muted ? "소리 켜기" : "소리 끄기";
    this.setAttribute("aria-label", label);
    if($("muteText")) $("muteText").textContent = label;
    savePreferences();
    if(!muted) void tone(880,.5,.12);
  };

  // swipe on hero for vessel
  let sx=0; els.hero.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; },{passive:true});
  els.hero.addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) selectVessel(dx<0?1:-1); },{passive:true});

  // ---- boot ----
  function boot(){
    applyVesselFits();
    buildDots(); buildSegState(); paintTea();
    sec=adjustedSecFor(infusion); syncSlider(); setInf(); previewIdle();
    const label = muted ? "소리 켜기" : "소리 끄기";
    $("mute").classList.toggle("muted",muted);
    $("mute").setAttribute("aria-pressed",muted);
    $("mute").setAttribute("aria-label",label);
    if($("muteText")) $("muteText").textContent = label;
    requestAnimationFrame(frame);
  }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(boot); else boot();

  // ---- service worker (PWA, only when hosted) ----
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
