<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d09">
<title>개인 설정 · 차 한 잔의 시간</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#120d09; --bg-1:#1d150e; --glow:#37301a;
    --gold:#cdbf63; --gold-soft:#e4d691; --gold-line:rgba(205,191,99,0.3);
    --ink:#efe6d6; --ink-dim:#9c8f78; --ink-faint:#7d715c; --line:#3a3322;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; }
  body{
    background:radial-gradient(120% 75% at 50% 18%, var(--glow) 0%, var(--bg-1) 46%, var(--bg-0) 84%);
    color:var(--ink); font-family:"Gowun Batang",serif; -webkit-tap-highlight-color:transparent;
  }
  .page{
    width:min(100vw,460px); min-height:100vh; margin:0 auto;
    padding:calc(.85rem + env(safe-area-inset-top)) 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:1.25rem;
  }
  .top{ display:flex; align-items:center; justify-content:space-between; min-height:44px; }
  .back{
    min-height:44px; padding:0 .2rem; border:0;
    color:var(--ink-dim); text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    background:none; font-size:1.05rem; font-family:inherit;
  }
  .back:active{ color:var(--gold-soft); }
  .mark-link{
    min-width:44px; min-height:44px; border:0; text-decoration:none;
    display:flex; align-items:center; justify-content:center; color:var(--gold-soft);
    font-family:inherit; font-size:1.12rem; font-weight:700; background:none;
  }
  .mark-link:active{ color:var(--ink); }
  header{ text-align:center; padding:.6rem 0 1rem; }
  h1{ font-size:1.45rem; color:var(--gold-soft); letter-spacing:.04em; }
  .sub{ margin-top:.35rem; font-family:"Space Mono",monospace; font-size:.68rem; letter-spacing:.16em; color:var(--ink-dim); }
  main{ display:flex; flex-direction:column; gap:1.4rem; }
  p{ color:var(--ink-dim); line-height:1.75; font-size:.94rem; margin-bottom:0.6rem; }
  .foot{ margin-top:auto; padding-top:1rem; color:var(--ink-faint); font-size:.78rem; line-height:1.6; text-align:center; }

  /* Preferences Item UI */
  .pref-card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 1.05rem; margin-bottom: 1rem;
  }
  .pref-title { font-size: 0.95rem; font-weight: 700; color: var(--gold-soft); margin-bottom: 0.85rem; display: block; }
  .tea-time-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .tea-time-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.35rem 0; border-bottom: 1px dashed rgba(255,255,255,0.06);
  }
  .tea-time-row:last-child { border-bottom: none; }
  .tea-label { font-size: 0.92rem; color: var(--ink); display: flex; align-items: center; gap: 0.35rem; }
  .tea-controls { display: flex; align-items: center; gap: 0.4rem; }
  .btn-step {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255,255,255,0.04); color: var(--ink); font-family: inherit; font-size: 1.05rem;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-step:active { background: rgba(205,191,99,0.2); border-color: var(--gold); }
  .time-disp { font-family: "Space Mono", monospace; font-size: 0.94rem; color: var(--gold-soft); min-width: 44px; text-align: center; }
  .delta-hint { font-size: 0.75rem; color: var(--ink-dim); }
  .btn-restore-single {
    font-size: 0.74rem; color: var(--gold-soft); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0 0.2rem;
  }

  /* Custom Tags UI */
  .tag-edit-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.9rem; }
  .tag-edit-chip {
    padding: 0.25rem 0.65rem; border-radius: 4px; background: rgba(205,191,99,0.16); color: var(--gold-soft);
    font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.35rem;
  }
  .btn-del-tag {
    background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 0.88rem; line-height: 1; padding: 0 2px;
  }
  .btn-del-tag:hover { color: #ff8888; }
  
  .add-tag-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; margin-bottom: 0.85rem; width: 100%; }
  .input-new-tag {
    flex: 1; min-width: 0; height: 44px; background: rgba(0,0,0,0.3); border: 1px solid var(--line);
    border-radius: 8px; padding: 0 0.75rem; color: var(--ink); font-family: inherit; font-size: 0.88rem; outline: none; transition: border-color 0.2s;
  }
  .input-new-tag:focus { border-color: var(--gold); }
  .btn-add-tag {
    flex: none; white-space: nowrap; height: 44px; padding: 0 1rem; border-radius: 8px; border: 1px solid var(--gold-line);
    background: rgba(205,191,99,0.18); color: var(--gold-soft); font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .btn-add-tag:active { background: rgba(205,191,99,0.32); border-color: var(--gold); }

  .preference-reset{
    width: 100%; min-height:44px; margin-top:.4rem; padding:0 .85rem; border:1px solid var(--line); border-radius:8px;
    background:transparent; color:var(--ink-dim); font-family:inherit; font-size:.88rem; cursor:pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.15s;
  }
  .preference-reset:active{ color:var(--gold-soft); border-color:var(--gold); }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a class="back" href="index.html">← 처음으로</a>
    <a class="mark-link" href="help.html" title="사용법" aria-label="사용법 열기">ⓘ</a>
  </div>

  <header>
    <h1>개인 설정</h1>
    <div class="sub">Preferences</div>
  </header>

  <main>
    <!-- 차별 시간 보정 설정 -->
    <div class="pref-card">
      <span class="pref-title">🍵 차별 권장 우림 시간 보정 (1포 기준)</span>
      <p style="font-size:0.84rem; margin-bottom:0.8rem;">내 취향에 맞게 기본 우림 시간을 조율합니다. 보정된 시간은 메인 타이머에 기억됩니다.</p>
      <div class="tea-time-list" id="teaTimeList">
        <!-- JS 렌더링 -->
      </div>
    </div>

    <!-- 단어 태그 커스텀 설정 -->
    <div class="pref-card">
      <span class="pref-title">🏷️ 오늘 떠오른 단어 태그 관리</span>
      <p style="font-size:0.84rem; margin-bottom:0.8rem;">[차 느낌] 시음 카드에 표시될 나만의 감각 단어를 추가하거나 원치 않는 단어를 삭제합니다.</p>
      <div class="tag-edit-grid" id="tagEditGrid">
        <!-- JS 렌더링 -->
      </div>
      <div class="add-tag-row">
        <input type="text" class="input-new-tag" id="newTagInput" placeholder="새 단어 입력 (예: 빙탕, 훈연향)" maxlength="10">
        <button type="button" class="btn-add-tag" id="addTagBtn">+ 추가</button>
      </div>
      <button type="button" class="preference-reset" id="restoreTagsBtn">🔄 기본 14종 단어로 복원</button>
    </div>

    <!-- 로컬 설정 전체 초기화 -->
    <div class="pref-card">
      <span class="pref-title">🗑️ 데이터 초기화</span>
      <p style="margin-bottom:0.5rem; font-size:0.84rem;">마지막으로 고른 차와 다구, 차별 시간 보정, 커스텀 태그를 모두 지우고 초기 상태로 돌아갑니다.</p>
      <button class="preference-reset" id="preferenceReset">기억한 설정 지우기</button>
      <p id="preferenceResetStatus" role="status" aria-live="polite" style="margin-top:0.4rem; font-size:0.8rem; color:var(--gold-soft);"></p>
    </div>
  </main>

  <div class="foot">차 한 잔의 시간 · Time for Tea</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PREF_KEY = "teaTimer.preferences.v1";
  
  const DEFAULT_TAGS = ["단맛", "꽃향", "과일", "곡물", "구운맛", "견과", "풀", "나무", "흙", "연기", "떫음", "부드러움", "맑음", "묵직함"];
  const TEAS_DATA = [
    { id: "green", name: "녹차", base: 15, emoji: "🌱" },
    { id: "white", name: "백차", base: 30, emoji: "🤍" },
    { id: "oolong", name: "청향 우롱", base: 20, emoji: "🍃" },
    { id: "dark-oolong", name: "농향 우롱", base: 20, emoji: "🍂" },
    { id: "black", name: "홍차", base: 12, emoji: "☕" },
    { id: "sheng-puer", name: "보이 생차", base: 15, emoji: "🍵" },
    { id: "shou-puer", name: "보이 숙차", base: 20, emoji: "🤎" }
  ];

  let prefs = {
    version: 1,
    secDeltaByTea: {},
    customTags: [...DEFAULT_TAGS]
  };

  function loadPrefs() {
    try {
      const raw = localStorage.getItem(PREF_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        prefs = { ...prefs, ...parsed };
        if (!prefs.secDeltaByTea) prefs.secDeltaByTea = {};
        if (!Array.isArray(prefs.customTags) || prefs.customTags.length === 0) {
          prefs.customTags = [...DEFAULT_TAGS];
        }
      }
    } catch(e) {}
  }

  function savePrefs() {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify(prefs));
    } catch(e) {}
  }

  loadPrefs();

  // Render Tea Times List
  function renderTeaTimes() {
    const list = $("teaTimeList");
    list.innerHTML = "";
    TEAS_DATA.forEach(tea => {
      const delta = prefs.secDeltaByTea[tea.id] || 0;
      const currentSec = tea.base + delta;

      const row = document.createElement("div");
      row.className = "tea-time-row";

      const label = document.createElement("div");
      label.className = "tea-label";
      label.innerHTML = `<span>${tea.emoji} ${tea.name}</span>`;

      const controls = document.createElement("div");
      controls.className = "tea-controls";

      const decBtn = document.createElement("button");
      decBtn.className = "btn-step";
      decBtn.textContent = "−";
      decBtn.onclick = () => {
        prefs.secDeltaByTea[tea.id] = delta - 1;
        savePrefs();
        renderTeaTimes();
      };

      const timeDisp = document.createElement("span");
      timeDisp.className = "time-disp";
      timeDisp.textContent = `${currentSec}초`;

      const incBtn = document.createElement("button");
      incBtn.className = "btn-step";
      incBtn.textContent = "+";
      incBtn.onclick = () => {
        prefs.secDeltaByTea[tea.id] = delta + 1;
        savePrefs();
        renderTeaTimes();
      };

      controls.appendChild(decBtn);
      controls.appendChild(timeDisp);
      controls.appendChild(incBtn);

      if (delta !== 0) {
        const hint = document.createElement("span");
        hint.className = "delta-hint";
        hint.textContent = `(${delta > 0 ? '+' : ''}${delta}초)`;

        const restoreSingleBtn = document.createElement("button");
        restoreSingleBtn.className = "btn-restore-single";
        restoreSingleBtn.textContent = "기본값";
        restoreSingleBtn.onclick = () => {
          delete prefs.secDeltaByTea[tea.id];
          savePrefs();
          renderTeaTimes();
        };

        controls.appendChild(hint);
        controls.appendChild(restoreSingleBtn);
      }

      row.appendChild(label);
      row.appendChild(controls);
      list.appendChild(row);
    });
  }

  // Render Tag Edits
  function renderTagEdits() {
    const grid = $("tagEditGrid");
    grid.innerHTML = "";
    prefs.customTags.forEach(tag => {
      const chip = document.createElement("span");
      chip.className = "tag-edit-chip";
      chip.textContent = "#" + tag;

      const delBtn = document.createElement("button");
      delBtn.className = "btn-del-tag";
      delBtn.textContent = "✕";
      delBtn.title = "삭제";
      delBtn.onclick = () => {
        prefs.customTags = prefs.customTags.filter(t => t !== tag);
        savePrefs();
        renderTagEdits();
      };

      chip.appendChild(delBtn);
      grid.appendChild(chip);
    });
  }

  $("addTagBtn").onclick = () => {
    const input = $("newTagInput");
    const val = input.value.trim().replace(/^#/, '');
    if (val && !prefs.customTags.includes(val)) {
      prefs.customTags.push(val);
      savePrefs();
      renderTagEdits();
      input.value = "";
    }
  };
  $("newTagInput").onkeydown = (e) => {
    if (e.key === "Enter") $("addTagBtn").click();
  };

  $("restoreTagsBtn").onclick = () => {
    prefs.customTags = [...DEFAULT_TAGS];
    savePrefs();
    renderTagEdits();
  };

  renderTeaTimes();
  renderTagEdits();

  $("preferenceReset").onclick = () => {
    try{
      localStorage.removeItem(PREF_KEY);
      $("preferenceResetStatus").textContent = "모든 개인 설정이 초기화되었습니다.";
      setTimeout(() => location.href="index.html", 1000);
    }catch(e){
      $("preferenceResetStatus").textContent = "설정을 지울 수 없습니다.";
    }
  };
})();
</script>
</body>
</html>
