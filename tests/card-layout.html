<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TW-07 카드 조판 검증</title>
<style>
body{margin:16px;font:16px system-ui;background:#eee;color:#222}button{min-height:44px}pre{white-space:pre-wrap;max-height:260px;overflow:auto}.runs{display:flex;flex-wrap:wrap;gap:20px}iframe{width:375px;height:660px;border:0}a{display:block}html:has(body.sample){overflow:hidden}body.sample{margin:0;overflow:hidden}body.sample iframe{display:block;width:100vw!important;height:100dvh}body.sample>h1,body.sample>p,body.sample>button,body.sample>pre{display:none}body.sample .runs{display:block}body.sample section>h2,body.sample section>a{display:none}
</style>
<h1>TW-07 카드 조판 검증</h1>
<p>127.0.0.1:8134 전용. 실제 앱 소스의 완료 기록만 fixture로 대체하고 시트 입력·PNG 공유/다운로드 경로를 실행합니다. 테스트 origin의 설정은 끝에 복원합니다. 사용자 8138 데이터와 OS 공유에는 접근하지 않습니다.</p>
<button id="run">카드 조판 검증 실행</button><pre id="result" role="status">대기 중</pre><div class="runs" id="runs"></div>
<script>
(() => {
  const KEY='teaTimer.preferences.v1', out=document.querySelector('#result'), runs=document.querySelector('#runs');
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function until(check,label){const end=Date.now()+15000;while(!check()){if(Date.now()>end)throw Error('시간 초과: '+label);await sleep(25);}}
  const samples={
    ko:{title:'아리산 금훤 · 봄날의 차',tags:['꽃향','단맛','깔끔함','부드러움','긴 여운'],note:'따뜻할 때는 꽃향이 먼저 올라왔다.\n식으니 배를 베어 문 듯 달았다.\n천천히 마시기 좋은 오후의 차.'},
    'zh-TW':{title:'阿里山金萱・春日茶記',tags:['花香','甜香','果香','清爽','細膩','餘韻感'],note:'熱的時候，先聞到淡淡的花香。\n稍微放涼後，像咬了一口熟梨。\n適合在午後慢慢喝的一杯茶。'},
    'ko-long':{title:'아리산에서 가져온 봄 금훤 — 비가 그친 오후 친구와 천천히 다시 꺼내 마신 차의 기록',tags:['꽃향','잘 익은 배','달콤한 향','부드러움','갓 구운 빵','단맛','꿀 같은 향','촉촉한 질감','깔끔함','묵직함','긴 여운','따뜻한 나무향','복숭아 껍질','맑은 풀향','마지막 한 모금'],note:'비가 그친 오후, 창가에서 천천히 마셨다.\n처음에는 꽃향이 맑게 올라오다가 두 번째 우림부터 잘 익은 배 같은 단맛이 났다. 찻잔이 식으니 갓 구운 빵처럼 포근한 향이 남았다.\n평소보다 시간을 짧게 잡으니 쓴맛은 줄고 입안의 부드러움이 또렷했다. 마지막 잔은 따뜻한 물에 꿀을 한 방울 풀어 놓은 듯했다. 다음에는 찻잎을 조금 덜 넣고 첫 우림을 길게 해 보고 싶다.'},
    'zh-TW-long':{title:'阿里山石棹高山金萱・春茶筆記 — 雨後的午後，和朋友慢慢品嚐，再次打開的春日香氣',tags:['花香','甜香','果香','焙香','鮮','甜','清爽','細膩','餘韻感','成熟的梨子','剛出爐的麵包','溫暖的木質香','柔和的蜂蜜香','濃稠','淡淡的桂花香','最後一口的餘韻'],note:'雨停後，坐在窗邊慢慢喝茶。\n第一泡的花香很清楚，第二泡開始有成熟梨子的甜味。茶湯稍微放涼，留下像剛出爐麵包一樣溫暖的香氣。\n這次把浸泡時間縮短，苦味少了，口中的細膩感更明顯。最後一杯像在溫水裡加了一滴蜂蜜。下次想減少一點茶葉，讓第一泡多泡幾秒，再比較香氣的變化。'},
    mixed:{title:'阿里山 봄차 🍃 👩🏽‍🌾 — 한국어와繁體中文으로 함께 적은 긴 차 이름'.repeat(3),tags:['桂花香','잘 익은 배','奶香','👩🏽‍🌾 새싹','긴단어와長單詞'.repeat(20),'蜜香','촉촉함','餘韻感','가벼움','花香'],note:'한글과繁體中文을 함께 적었다. 👨‍👩‍👧‍👦\n朋友說：「有一點桂花香，喝完很舒服。」\n'+ '가나다라마바사阿里山高山茶'.repeat(20)},
    empty:{title:'청향 우롱 · 개완',tags:[],note:''}
  };
  async function pngUrl(file){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file);});}
  const sampleParam=new URLSearchParams(location.search).get('sample');
  document.querySelector('#run').onclick=async function(){
    if(location.origin!=='http://127.0.0.1:8134'){out.textContent='FAIL 테스트 origin만 허용';return;}
    this.disabled=true;runs.replaceChildren();const lines=[], original=localStorage.getItem(KEY);
    const check=(name,ok)=>{if(!ok)throw Error(name);lines.push('PASS '+name);out.textContent=lines.join('\n');};
    try{
      const source=await (await fetch('../index.html',{cache:'no-store'})).text();
      const cases=sampleParam?[{id:sampleParam}]:[{id:'ko'},{id:'zh-TW'},{id:'ko-long'},{id:'zh-TW-long'},{id:'mixed'},{id:'empty'},{id:'ko-long',blocked:true},{id:'zh-TW-long',blocked:true}];
      for(const test of cases){
        const sample=samples[test.id],locale=test.id.startsWith('zh-TW')?'zh-TW':'ko';
        const history=test.id==='empty'?[]:(test.id.endsWith('long')||test.id==='mixed'?[20,25,30,35,45,55,70,90,120,150,180,240]:[20,25,30]).map((sec,i)=>({n:i+1,sec}));
        const label=test.id+(test.blocked?'-fallback':'');
        const seed={version:1,locale,muted:true,lastTeaId:'oolong',lastVesselId:'gaiwan',tagItems:sample.tags.map(text=>({kind:'custom',text}))};
        localStorage.setItem(KEY,JSON.stringify(seed));
        const section=document.createElement('section'),heading=document.createElement('h2'),frame=document.createElement('iframe');
        heading.textContent=label;frame.title=label+' 실제 앱';section.append(heading,frame);runs.append(section);
        const loaded=new Promise(resolve=>frame.onload=resolve);
        const csp=test.blocked?'<meta http-equiv="Content-Security-Policy" content="default-src \'self\' data: blob:; style-src \'self\' \'unsafe-inline\'; font-src \'none\'; img-src \'self\' data: blob:; script-src \'self\' \'unsafe-inline\'; connect-src \'none\'">':'';
        check(label+' fixture 기록 주입 경계',source.includes('let infusionHistory = [], activeBrew = null;'));
        frame.srcdoc=source.replace('<head>','<head><base href="../">'+csp).replace('let infusionHistory = [], activeBrew = null;','let infusionHistory = '+JSON.stringify(history)+', activeBrew = null;');
        await loaded;const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id),errors=[];
        w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
        await until(()=>$('brew')&&!$('brew').disabled,'boot');
        const click=id=>$(id).click();const input=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));};
        click('note');click('editTitleBtn');input('teaTitleInput',sample.title);$('teaTitleInput').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));input('noteInput',sample.note);
        d.querySelectorAll('#tagsGrid [data-tag-key]').forEach(el=>el.click());
        let copied='',file,download;
        Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async text=>copied=text}});
        Object.defineProperty(w.navigator,'canShare',{configurable:true,value:()=>true});
        Object.defineProperty(w.navigator,'share',{configurable:true,value:async data=>{file=data.files[0];throw new w.DOMException('fixture cancel','AbortError');}});
        const painted=[],fill=w.CanvasRenderingContext2D.prototype.fillText;
        w.CanvasRenderingContext2D.prototype.fillText=function(text,x,y,...args){painted.push({text:String(text),x,y});return fill.call(this,text,x,y,...args);};
        click('cardBtn');await w.document.fonts.ready;await sleep(100);
        const canvas=$('cardCanvas');check(label+' PNG 원본 크기',canvas.width===680&&canvas.height===900);
        const rows=id=>$(id).textContent.split('\n').filter(Boolean);
        check(label+' 2/2/3/5 표시 한도',rows('cardTeaName').length<=2&&rows('cardHistory').length<=2&&rows('cardTagsContainer').length<=3&&rows('cardNoteQuote').length<=5);
        check(label+' 접근성 텍스트와 실제 조판 일치',['cardTeaName','cardInfusions','cardNoteQuote'].every(id=>rows(id).every(text=>painted.some(p=>p.text===text))));
        check(label+' 전체 완료 포 수', $('cardInfusions').textContent.includes(history.length?String(history.length):locale==='ko'?'완료된 우림 없음':'沒有完成的泡茶紀錄'));
        if(test.id.endsWith('long'))check(label+' 긴 제목·메모·포 기록 생략', $('cardTeaName').textContent.endsWith('…')&&$('cardNoteQuote').textContent.endsWith('…')&&$('cardHistory').textContent.includes(locale==='ko'?'외 ':'另 '));
        const before=canvas.toDataURL('image/png');
        const textsBefore=['cardTeaName','cardInfusions','cardHistory','cardTagsContainer','cardNoteQuote','cardFooterDate'].map(id=>$(id).textContent);
        click('shareCardBtn');await until(()=>file,'PNG share');const url=await pngUrl(file);
        const image=new Image();image.src=url;await image.decode();
        check(label+' 미리보기와 공유 PNG 픽셀 동일',url===before&&image.naturalWidth===680&&image.naturalHeight===900);
        check(label+' 원문 메모·설정 보존',$('noteInput').value===sample.note&&JSON.stringify(JSON.parse(localStorage.getItem(KEY)).tagItems)===JSON.stringify(seed.tagItems));
        click('copyBtn');await until(()=>copied,'clipboard');
        check(label+' 전체 텍스트 원문 보존',copied.includes(sample.title)&&copied.includes(sample.note.trim())&&sample.tags.every(tag=>copied.includes('#'+tag))&&history.every(h=>copied.includes(locale==='ko'?h.n+'포 '+h.sec+'초':'第'+h.n+'泡 '+h.sec+'秒')));
        // Exercise download fallback; intercept only this iframe's anchor, never download to user folders.
        Object.defineProperty(w.navigator,'canShare',{configurable:true,value:()=>false});
        const anchorClick=w.HTMLAnchorElement.prototype.click;
        w.HTMLAnchorElement.prototype.click=function(){if(this.download)download={url:this.href,name:this.download};else anchorClick.call(this);};
        click('cardBtn');click('shareCardBtn');await until(()=>download,'PNG download');
        const blob=await (await fetch(download.url)).blob();check(label+' 다운로드 폴백 PNG',blob.type==='image/png'&&blob.size>0&&download.name.endsWith('.png'));
        w.HTMLAnchorElement.prototype.click=anchorClick;
        click('cardBtn');
        for(const width of [320,375]){frame.style.width=width+'px';await sleep(30);$('shareCardBtn').focus();const r=$('shareCardBtn').getBoundingClientRect();check(label+' '+width+'px 조작/넘침',d.documentElement.scrollWidth<=width&&$('cardDialog').scrollWidth<=$('cardDialog').clientWidth+1&&r.height>=44&&r.top>=0&&r.bottom<=660);}
        $('closeCardModalBtn').focus();
        check(label+' 브라우저 예외 없음',errors.length===0);
        const link=document.createElement('a');link.href=url;link.download=label+'-680x900.png';link.textContent=label+' PNG';section.append(link);
        const raw=document.createElement('a');raw.href='data:text/plain;charset=utf-8,'+encodeURIComponent(copied);raw.download=label+'-full-text.txt';raw.textContent=label+' 전체 텍스트';section.append(raw);
        section.dataset.preview=JSON.stringify(textsBefore);
      }
      lines.push('완료: '+lines.length+'개 통과');out.textContent=lines.join('\n');
      if(sampleParam)document.body.classList.add('sample');
    }catch(e){out.textContent=lines.join('\n')+'\nFAIL '+e.stack;}
    finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);this.disabled=false;}
  };
})();
</script></html>
